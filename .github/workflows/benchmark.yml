name: checks

# Runs the correctness tests on every push, and the full MPC benchmark sweep on
# demand or weekly. The MPC job builds MP-SPDZ from source (~8 min cold, cached
# afterwards), so it is deliberately not on the push path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # manual only - see the gate below

jobs:

  # ---------------------------------------------------------------------
  # Fast: the exact-rational reference. This is the gate that matters.
  # ---------------------------------------------------------------------
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Reference test suite
        run: python3 -m pytest reference/ -v

      - name: Conformance oracle + fixture
        run: python3 -m pytest conformance/ -v

  # ---------------------------------------------------------------------
  # Slow: build MP-SPDZ and run the circuit.
  # ---------------------------------------------------------------------
  # DISABLED. Performance work is out of scope until the conformance target in
  # docs/conformance.md passes. This job measures a circuit known not to
  # implement the PLAS functionality; running it produces precise numbers for
  # the wrong computation. Re-enable only after conformance, by removing the
  # `if: false` below.
  mpc:
    if: false
    runs-on: ubuntu-latest
    needs: reference
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Network conditions emulated with `tc netem` on loopback.
        # NOTE: this is emulation on a single host, not geographically
        # separate machines. Any paper using these numbers must say so.
        network:
          - { name: localhost, delay: "0ms",  rate: "" }
          - { name: lan,       delay: "0.2ms", rate: "1gbit" }
          - { name: wan,       delay: "50ms",  rate: "100mbit" }
    steps:
      - uses: actions/checkout@v4

      - name: Cache MP-SPDZ build
        id: cache-mpspdz
        uses: actions/cache@v4
        with:
          path: MP-SPDZ
          key: mpspdz-${{ runner.os }}-v0.4.3-replicated

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libsodium-dev libssl-dev libboost-dev \
            libboost-thread-dev libboost-filesystem-dev libboost-iostreams-dev \
            iproute2

      - name: Build MP-SPDZ
        if: steps.cache-mpspdz.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/data61/MP-SPDZ
          cd MP-SPDZ
          make -j$(nproc) replicated-ring-party.x
          Scripts/setup-ssl.sh 3

      - name: Stage circuits
        run: cp mpc/*.mpc MP-SPDZ/Programs/Source/

      - name: Write party inputs
        # The circuits read one secret per party via sint.get_input_from(i),
        # which MP-SPDZ expects to find in Player-Data/Input-P<i>-0.
        # Secrets (63, 40, 55) are the pinned correctness case: party 0 is the
        # richest, so the posterior is uniform over the 54x54 states with
        # s2,s3 <= 63 and the max marginal is exactly 1/54 = 0.0185185.
        # Cross-check: reference/test_reference.py::test_known_case_63_40_55
        working-directory: MP-SPDZ
        run: |
          mkdir -p Player-Data
          echo 63 > Player-Data/Input-P0-0
          echo 40 > Player-Data/Input-P1-0
          echo 55 > Player-Data/Input-P2-0

      - name: Apply network conditions
        if: matrix.network.delay != '0ms'
        run: |
          # netem needs NET_ADMIN; GitHub runners grant it via sudo.
          # If this step fails the emulation is not happening -- do not
          # silently fall through and report the numbers as LAN/WAN.
          sudo tc qdisc add dev lo root netem \
            delay ${{ matrix.network.delay }} \
            ${{ matrix.network.rate && format('rate {0}', matrix.network.rate) || '' }}
          tc qdisc show dev lo

      - name: Compile and run
        working-directory: MP-SPDZ
        run: |
          set -o pipefail
          DOM=${{ github.event.inputs.domain || '91' }}
          ./compile.py -R 64 belief3 "$DOM" 16 31 2>&1 | tail -20
          Scripts/ring.sh "belief3-$DOM-16-31" 2>&1 | tee ../result-${{ matrix.network.name }}.txt

      - name: Remove network conditions
        if: always() && matrix.network.delay != '0ms'
        run: sudo tc qdisc del dev lo root || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.network.name }}
          path: result-*.txt

  conformance-mpc:
    runs-on: ubuntu-latest
    needs: reference
    timeout-minutes: 40
    env:
      MPSPDZ_PIN: 9d809599ea6ce627216a389ca7d984fbb75d0cb9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache MP-SPDZ build (pinned)
        id: cache-mpspdz
        uses: actions/cache@v4
        with:
          path: MP-SPDZ
          key: mpspdz-${{ runner.os }}-9d809599ea6ce627216a389ca7d984fbb75d0cb9-replicated
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libsodium-dev libssl-dev libboost-dev \
            libboost-thread-dev libboost-filesystem-dev libboost-iostreams-dev
      - name: Build MP-SPDZ at pinned commit
        if: steps.cache-mpspdz.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/data61/MP-SPDZ
          cd MP-SPDZ
          git checkout $MPSPDZ_PIN
          make -j$(nproc) replicated-ring-party.x
      - name: Record MP-SPDZ provenance
        run: |
          cd MP-SPDZ
          echo "MP-SPDZ HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$MPSPDZ_PIN" || (echo "PIN MISMATCH" && exit 1)
      - name: SSL certs
        run: cd MP-SPDZ && Scripts/setup-ssl.sh 3
      - name: pipefail canary (prove a failing suite cannot go green)
        run: |
          set -o pipefail
          if (python3 -c "import sys; sys.exit(73)" | tee /dev/null); then
            echo "FAIL: non-zero did not propagate through the logging pipe"; exit 1
          fi
          echo "OK: pipeline propagates non-zero under pipefail"
      - name: Named-case harness
        run: |
          set -o pipefail
          EVIDENCE=$PWD/conformance/_evidence/ci-harness.jsonl \
            MPSPDZ=$PWD/MP-SPDZ python3 conformance/harness.py 2>&1 | tee harness-ci.log
      - name: 228-case adversarial coverage
        run: |
          set -o pipefail
          EVIDENCE=$PWD/conformance/_evidence/ci-coverage.jsonl \
            MPSPDZ=$PWD/MP-SPDZ python3 conformance/coverage.py 2>&1 | tee coverage-ci.log
      - name: Private per-recipient delivery (leakage check)
        run: |
          set -o pipefail
          MPSPDZ=$PWD/MP-SPDZ python3 conformance/private_run.py 2>&1 | tee private-ci.log
      - name: Validate raw evidence (fail closed, SHA-bound)
        run: |
          python3 conformance/validate_evidence.py conformance/_evidence/ci-harness.jsonl \
            --count 4   --repo "$GITHUB_SHA" --mpspdz "$MPSPDZ_PIN" --require-bound
          python3 conformance/validate_evidence.py conformance/_evidence/ci-coverage.jsonl \
            --count 228 --repo "$GITHUB_SHA" --mpspdz "$MPSPDZ_PIN" --require-bound
      - name: Compress raw evidence
        run: gzip -f conformance/_evidence/ci-harness.jsonl conformance/_evidence/ci-coverage.jsonl
      - name: Upload raw evidence + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence
          if-no-files-found: error
          path: |
            harness-ci.log
            coverage-ci.log
            private-ci.log
            conformance/_evidence/ci-harness.jsonl
            conformance/_evidence/ci-coverage.jsonl
            conformance/_evidence/ci-harness.jsonl.gz
            conformance/_evidence/ci-coverage.jsonl.gz
